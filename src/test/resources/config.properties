############################################
# Browser Configuration
############################################
browser=chrome

# Run browser in headless mode (true / false)
headless=true

############################################
# Application Configuration
############################################
# OrangeHRM Demo URL
url=https://opensource-demo.orangehrmlive.com/

############################################
# Timeouts (in seconds)
############################################
implicitWait=10
pageLoadTimeout=30
explicitWait=20

############################################
# Environment
############################################
environment=qa

############################################
# Test Credentials (Demo only)
############################################
username=Admin
password=admin123

############################################
# Execution Flags
############################################
takeScreenshotOnFailure=true
